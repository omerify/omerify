<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="background:#0a0a0c; font-family:'Courier New', Courier, monospace; border-radius: 12px; border: 1px solid rgba(0,255,204,0.15);">
  <!-- Defs for gradients/filters -->
  <defs>
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Scanline pattern -->
    <pattern id="scanlines" width="800" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="800" y2="0" stroke="rgba(0, 255, 204, 0.04)" stroke-width="2" />
    </pattern>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 255, 204, 0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Grid & Scanlines -->
  <rect width="100%" height="100%" fill="#0a0a0c" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect width="100%" height="100%" fill="url(#scanlines)" />

  <!-- Terminal Window Frame -->
  <rect x="15" y="15" width="770" height="170" rx="8" fill="none" stroke="#1c1c24" stroke-width="1.5" />
  <!-- Window Controls -->
  <circle cx="40" cy="35" r="5" fill="#ff5f56" />
  <circle cx="55" cy="35" r="5" fill="#ffbd2e" />
  <circle cx="70" cy="35" r="5" fill="#27c93f" />
  
  <text x="95" y="40" fill="#8b8b99" font-size="12" letter-spacing="1">omerify@terminal: ~</text>

  <!-- Main Content -->
  <!-- Logo/Icon placeholder or symbol -->
  <g transform="translate(45, 65)">
    <!-- Retro terminal prompt symbol -->
    <text x="0" y="65" fill="#00ffcc" font-size="75" font-weight="bold" filter="url(#glow)">&gt;</text>
  </g>
  
  <!-- Text content -->
  <text x="135" y="105" fill="#ffffff" font-size="38" font-weight="bold" letter-spacing="2">OMERIFY</text>
  <text x="135" y="138" fill="#00ffcc" font-size="18" font-weight="bold" filter="url(#subtle-glow)">Ne yaptığını biliyorsan; Yapma!</text>

  <!-- Animated cursor -->
  <rect x="485" y="123" width="10" height="18" fill="#00ffcc" filter="url(#subtle-glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- Right side decorations: mock system stats -->
  <g transform="translate(560, 75)" font-size="11" fill="#8b8b99">
    <text x="0" y="0" fill="#00ffcc">[ SYSTEM STATUS ]</text>
    <text x="0" y="20">OS: Arch Linux x86_64</text>
    <text x="0" y="35">Shell: zsh 5.9</text>
    <text x="0" y="50">Terminal: RetroCRT</text>
    <text x="0" y="65">Status: Online &amp; Coding</text>
  </g>

  <!-- Subtly animated decorative wave or graph in the corner -->
  <path d="M 560 160 Q 610 140, 660 170 T 760 150" fill="none" stroke="rgba(0, 255, 204, 0.2)" stroke-width="2" filter="url(#subtle-glow)">
    <animate attributeName="d" 
             values="M 560 160 Q 610 140, 660 170 T 760 150;
                     M 560 160 Q 610 170, 660 145 T 760 160;
                     M 560 160 Q 610 140, 660 170 T 760 150" 
             dur="6s" 
             repeatCount="indefinite" />
  </path>
</svg>
